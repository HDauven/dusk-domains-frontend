name: Abuse report
description: Report phishing, impersonation or a harmful record on a .dusk name.
title: "[Abuse]: "
body:
  - type: markdown
    attributes:
      value: |
        For a security vulnerability, use "Report a vulnerability" instead, so it stays private.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of abuse?
      options:
        - Phishing or impersonation
        - Lookalike of an official name
        - Harmful or misleading record
        - Something else
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: wallet-example.dusk
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links, screenshots or transaction IDs.
