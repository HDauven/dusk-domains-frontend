<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The Dusk Domains mark: the share card's sunset in a tile. Same palette as the card. -->
  <defs>
    <linearGradient id="sky" x2="0.3" y2="1"><stop stop-color="#171222"/><stop offset="0.6" stop-color="#35223c"/><stop offset="1" stop-color="#58344b"/></linearGradient>
    <linearGradient id="disc" x2="0.2" y2="1"><stop stop-color="#f2c5ab"/><stop offset="1" stop-color="#d79588"/></linearGradient>
    <linearGradient id="rim"><stop stop-color="#b173df"/><stop offset="0.55" stop-color="#d4b5eb"/><stop offset="0.8" stop-color="#f2c5ab"/><stop offset="1" stop-color="#d79588"/></linearGradient>
    <filter id="atmosphere" filterUnits="userSpaceOnUse" x="-128" y="-128" width="768" height="768"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-128" y="-128" width="768" height="768"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="322" cy="300" r="100" fill="#f2c5ab" opacity="0.4" filter="url(#atmosphere)"/>
    <circle cx="322" cy="300" r="92" fill="url(#disc)"/>
    <ellipse cx="256" cy="536" rx="430" ry="190" fill="url(#rim)" opacity="0.85" filter="url(#atmosphere)"/>
    <ellipse cx="256" cy="543" rx="430" ry="190" fill="none" stroke="url(#rim)" stroke-width="7" filter="url(#glow)"/>
    <ellipse cx="256" cy="543" rx="430" ry="190" fill="#201529" stroke="url(#rim)" stroke-width="3"/>
  </g>
</svg>
