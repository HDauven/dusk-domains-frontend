    <script>
      // Until the app starts, #root holds the home page's first render. Elsewhere only its frame
      // shows, and its search form must not submit and reload the page.
      if (location.pathname.replace(/\/+$/, '')) document.documentElement.setAttribute('data-deep-link', '')
      document.addEventListener('submit', (event) => {
        if (event.target instanceof Element && event.target.closest('#root[data-static-shell]')) event.preventDefault()
      }, true)
    </script>

  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const walletRequestPattern = /(?=.*(?:wallet|profile request|dusk_requestProfiles|site is not connected))(?=.*(?:locked|reject|denied|cancel|not connected|unauthori[sz]ed))/i
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason
          const message = reason instanceof Error ? reason.message : String(reason || '')
          if (!walletRequestPattern.test(message)) return

          event.preventDefault()
          event.stopImmediatePropagation()
          window.dispatchEvent(new CustomEvent('dusk-domains:wallet-request-error', {
            detail: { message },
          }))
        }, true)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
